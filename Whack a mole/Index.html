<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Whack a mole</title>

</head>
<body>
    <div class="container">
        <div class="header">
            <div class="top">
                <b>Score:</b>&nbsp;<span id="score">0</span>
            </div>

            <div class="top">
                <b>Time left:</b>&nbsp;<span id="time">00</span>
            </div>

        </div>

        <div class="card-con">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"> </div>
            <div class="box"> </div>
            <div class="box"></div>
            
        </div>

        <div class="footer">Game starting at... <span> 5 </span></div>
        <div class="result">
            <p>
                Time's up! You've whacked 
                <span id="finalScore">0</span> point.
            </p>
                <div class="restart">
                    <u>Click here to restart</u>
                </div>
        </div>

    </div>
    
</body>
</html>
