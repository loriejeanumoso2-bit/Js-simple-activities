<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Rock,Scissors,and Paper</title>
</head>
<body>
    <div class="container">

        <div class="status-bar">
            <div class="computer-score">Computer: <span>0</span></div>
            <div class="player-score">Player: <span>0</span></div>
        </div>

        <div class="action-bar">
            <div class="action" id="rock">👊
                <!-- <img src="img/rock.jpg"> -->
            </div>
            <div class=" action" id="paper">✋
                 <!-- <img src="img/paper.jpg"> -->
            </div>
            <div class="action" id="scissors">✌️
                 <!-- <img src="img/scissors(1).jpg"> -->
            </div>
        </div>

        <div class="footer">
            <span>Make a selection. Rock, Paper, Scissors?</span>
        </div>

        <div class="result-wrapper hide">
            <div class="player-picked">
                You choice <span>Rock</span>.
            </div>

            <div class="com-picked">
                Computer choce <span>Paper</span>.
            </div>

            <div class="result">
                You win!
            </div>

            <div class="reset">
            Reset the score?<u>Click Here</u>
            </div>
        </div>
    </div>
</body>
</html>
