<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
     <title>Hangman Game</title>
</head>

<body>
    <div class="container">
        <div class="left-side">
            <div class="name">
                <h2>IBITAY</h2>
            </div>
            <div class="title">
                <h4>Hangman Game</h4>
            </div>
        </div>

    <div class="right-side">
        <div class="answer">bandwagon</div>
        <div class="hint">
            <span>Hint:a popular trend, movement, party, or sports team that attracts growing support simply because it has become successful or fashionable</span>
        </div>
        <div class="guesses">
            Incorrect guesses:&nbsp;<span><b>0/6</span></b>
        </div>
                        <div class="keyboard-con">

                                <button class="key">A</button>
                                <button class="key">B</button>
                                <button class="key">C</button>
                                <button class="key">D</button>
                                <button class="key">E</button>
                                <button class="key">F</button>
                                <button class="key">G</button>
                                <button class="key">H</button>
                                <button class="key">I</button>
                                <button class="key">J</button><br>
                                <button class="key">K</button>
                                <button class="key">L</button>
                                <button class="key">M</button>
                                <button class="key">N</button>
                                <button class="key">O</button>
                                <button class="key">P</button>
                                <button class="key">Q</button>
                                <button class="key">R</button>
                                <button class="key">S</button>
                                <button class="key">T</button><br>

                                <div class="row2">
                                <button class="key">U</button>
                                <button class="key">V</button>
                                <button class="key">W</button>
                                <button class="key">X</button>
                                <button class="key">Y</button>
                                <button class="key">Z</button>
                                <button class="key">_</button>
                                <button class="key">'</button>
                                </div>

                        </div>
    </div>
               
    </body>
</html>
