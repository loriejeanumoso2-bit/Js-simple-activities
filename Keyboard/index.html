<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
     <title>Keyboard</title>
</head>

<body>
    <div class="container">
        <div class="header">Word Scramble</div>
                <div class="word-box">
                    <div class="letter-box">D</div>
                    <div class="letter-box">O</div>
                    <div class="letter-box">R</div>
                    <div class="letter-box">W</div>
                </div>

                <div class="word">
                    <h4>Hint:The basic of a language</h4>
                </div>

                <div class="input-wrapper">
                <input type="text" placeholder="Enter your guess">
                <button class="check" id="check">Check</button>
                <button class="refresh" id="refresh">Refresh</button>
                </div>
                        <div class="keyboard-con">

                                <button class="key">A</button>
                                <button class="key">B</button>
                                <button class="key">C</button>
                                <button class="key">D</button>
                                <button class="key">E</button>
                                <button class="key">F</button>
                                <button class="key">G</button>
                                <button class="key">H</button>
                                <button class="key">I</button><br>
                                <button class="key">J</button>
                                <button class="key">K</button>
                                <button class="key">L</button>
                                <button class="key">M</button>
                                <button class="key">N</button>
                                <button class="key">O</button>
                                <button class="key">P</button>
                                <button class="key">Q</button>
                                <button class="key">R</button>

                                <div class="row3">
                                    <button class="key">S</button>
                                    <button class="key">T</button>
                                    <button class="key">U</button>
                                    <button class="key">V</button>
                                    <button class="key">W</button>
                                    <button class="key">X</button>
                                    <button class="key">Y</button>
                                    <button class="key">Z</button>
                                </div>

                            <button id="space">SPACE</button>
                            <button id="delete">DELETE</button>

                        </div>
    </body>
</html>
