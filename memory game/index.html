<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>MEMORY GAME</title>
</head>

<body>

    <div class="container">
        <h1>Memory Game</h1>

        <div class="header">

            <div class="top">
                <b>Timer:</b>&nbsp;<span id="time">0</span>s
            </div>

            <div class="top">
                <b>Moves:</b>&nbsp;<span id="move">0</span>
            </div>

        </div>

        <div class="card-con"></div>

        <div class="footer">

            <h3>Congratulations!</h3>

            <p>
                You finished the game in
                <span id="finalTime">0</span>s
                and
                <span id="finalMoves">0</span>
                moves.
            </p>

            <button id="restart">Restart the Game</button>

        </div>

    </div>

</body>
</html>
